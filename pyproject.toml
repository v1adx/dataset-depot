[project]
name = "dataset-depot"
version = "0.1.0"
description = "Declarative datasets with a dependency graph and a runner that recomputes only what moved"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "orjson>=3.9",
]

[project.urls]
Homepage = "https://github.com/v1adx/dataset-depot"
Repository = "https://github.com/v1adx/dataset-depot"

[project.optional-dependencies]
gui = ["nicegui>=1.4"]

[project.scripts]
depot = "depot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["depot", "depot_gui"]
exclude = ["*/tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["depot/tests", "depot_gui/tests"]
asyncio_mode = "auto"
