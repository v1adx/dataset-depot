name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --all-extras
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Test
        run: uv run pytest -q
        env:
          UV_PYTHON: ${{ matrix.python-version }}
